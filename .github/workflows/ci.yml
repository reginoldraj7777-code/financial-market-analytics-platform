name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py src/main.py src/dashboard_utils.py src/preflight.py src/gtm_demo.py src/snowflake_adapter.py

      - name: Run deterministic pipeline
        run: python src/main.py --offline

      - name: Run tests and preflight
        run: python src/preflight.py
